[package]
name = "estante"
version = "0.3.1"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "image-without-codecs", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
