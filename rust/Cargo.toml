[package]
name = "estante"
version = "0.5.0"
edition = "2024"
build = "build.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
png = "0.18.1"
tiff = "0.11.3"
resvg = "0.49"
ksni = { version = "0.3.7", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
rustix = { version = "1", features = ["process"] }
icu_casemap = "2.4"
unicode-normalization = "0.1"
slint = {
    version = "1.19",
    default-features = false,
    features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "unstable-winit-030"],
}

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
i-slint-backend-testing = "1.19"

[patch.crates-io]
# tiff 0.11.3 calculates tiled edge padding with the global planar chunk index.
tiff = { path = "vendor/tiff" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
